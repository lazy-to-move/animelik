services:
  - type: web
    name: synx-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /healthz
    preDeployCommand: npm run db:migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ID
        value: synx-web
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synx-db
          property: connectionString
      - key: IMPORTED_MEDIA_DIR
        value: /var/data/anime-covers
      - key: SCRAPER_EXECUTION_MODE
        value: queue
      - key: SITE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: KIMI_AUTH_URL
        sync: false
      - key: KIMI_OPEN_URL
        sync: false
      - key: OWNER_UNION_ID
        sync: false
    disk:
      name: synx-media
      mountPath: /var/data
      sizeGB: 5
  - type: worker
    name: synx-scraper-worker
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerCommand: node start-worker.mjs
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ID
        value: synx-worker
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synx-db
          property: connectionString
      - key: SCRAPER_EXECUTION_MODE
        value: queue
      - key: SCRAPER_WORKER_POLL_MS
        value: 5000

databases:
  - name: synx-db
    plan: basic-256mb
    databaseName: synx
    user: synx
